{% extends 'base.html' %}
{% load static %}

{% block title %}Admin Login - Bardhe Clinic{% endblock %}

{% block content %}
<div class="admin-login-container">
    <div class="login-box">
        <div class="login-header">
            <img src="{% static 'images/Logo.png' %}" alt="Logo" class="login-logo">
            <h2>Admin Login</h2>
            <p>Enter your credentials to access dashboard</p>
        </div>
        
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" class="login-form">
            {% csrf_token %}
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>
</div>

<style>
.admin-login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0A2647 0%, #2C74B3 100%);
    padding: 20px;
    margin-top: -12px;
}

.login-box {
    background: white;
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: slideUp 0.5s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(50px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.login-header {
    text-align: center;
    margin-bottom: 30px;
}

.login-logo {
    width: 80px;
    height: 80px;
    margin-bottom: 15px;
}

.login-header h2 {
    color: #0A2647;
    margin-bottom: 5px;
}

.login-header p {
    color: #666;
    font-size: 14px;
}

.error-message {
    background: #fee;
    color: #c00;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: center;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: 500;
}

.input-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    transition: 0.3s;
}

.input-group input:focus {
    outline: none;
    border-color: #2C74B3;
    box-shadow: 0 0 5px rgba(44,116,179,0.3);
}

.login-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #0A2647, #2C74B3);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(44,116,179,0.4);
}
</style>
{% endblock %}
